name: Backrooms | Compilacao historica (sem publicacao)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Compilar prototipo descontinuado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Rojo 7.7.1
        run: cargo install rojo --version 7.7.1 --locked

      - name: Validar configuracao
        run: python3 -m json.tool default.project.json > /dev/null

      - name: Construir arquivo historico
        run: |
          set -euo pipefail
          rojo build default.project.json --output backrooms.rbxlx
          test -s backrooms.rbxlx

      - name: Guardar artefato (sem publicar)
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-historico-rbxlx
          path: backrooms.rbxlx
          if-no-files-found: error
